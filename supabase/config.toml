project_id = "moves"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://scnpg.github.io/moves"
additional_redirect_urls = ["https://scnpg.github.io/moves/*", "http://localhost:8081"]
# Short-lived access token - autoRefreshToken (src/lib/supabase.ts) renews
# it transparently in the background via the (separately long-lived)
# refresh token, so this is invisible to the user. Keeps the blast radius
# of a leaked/intercepted access token small.
jwt_expiry = 900
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off for now: the Resend account has no verified domain, so its sandbox
# mode only delivers to the account owner's own address (ian0205huang@
# gmail.com) - every other signup's confirmation email fails to send,
# which blocks the signup outright. Re-enable once a domain is verified
# in Resend (see README) and the sandbox restriction is lifted.
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

# GoTrue's own email-send cap - separate from the SMTP relay above and from
# max_frequency (that's the per-address cooldown; this is the project-wide
# hourly ceiling). Defaults to a low value even with custom SMTP enabled,
# so it still throttled signups after Resend was wired up.
[auth.rate_limit]
email_sent = 30
# Sign-in/sign-up attempts (brute-force guard on the password login and
# signup endpoints) and refresh-token redemptions, per 5-minute window per
# IP - GoTrue's defaults if left unset are far looser than this app needs.
sign_in_sign_ups = 30
token_refresh = 150

# {{ .ConfirmationURL }} already embeds {{ .RedirectTo }} as a query param
# (it's the full "verify then redirect" link GoTrue builds server-side) -
# no need to reference .RedirectTo separately in the template body.
[auth.email.template.confirmation]
subject = "Confirm your Moves? signup"
content_path = "./supabase/templates/confirmation.html"

# Hosted "moves" project only - lifts Supabase's built-in mailer off its
# ~2-4/hour cap. Secret comes from the RESEND_SMTP_PASS env var at
# `supabase config push` time - never committed here. Local dev catches
# confirmation emails with the built-in Inbucket UI below (view them at
# http://127.0.0.1:55324), so this section is inert for `supabase start`.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASS)"
admin_email = "onboarding@resend.dev"
sender_name = "Moves?"

[realtime]
enabled = true

[analytics]
enabled = false
